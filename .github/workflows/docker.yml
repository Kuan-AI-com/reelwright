name: docker
# Publishes ghcr.io/<owner>/reelwright on every push to main and on version tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/reelwright
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          docker run -d --name rw -p 8080:8080 -e REELWRIGHT_PASSWORD=ci "ghcr.io/${OWNER,,}/reelwright:sha-${GITHUB_SHA::7}"
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && exit 0; sleep 2; done
          docker logs rw; exit 1
